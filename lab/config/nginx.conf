user www-data;
pid /run/nginx.pid;
error_log /dev/stderr;

events {}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;

    server {
        listen 443 ssl;
        server_name web;
        ssl_certificate /etc/nginx/lab-tls/web.crt;
        ssl_certificate_key /etc/nginx/lab-tls/web.key;
        root /srv/web;
        index index.html;
    }
}
